name: Dr.Fabs Full-Site Crawl

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Website to crawl
        required: true
        default: https://fabrockers.com
      max_pages:
        description: Maximum pages/URLs to visit
        required: true
        default: "25000"

permissions:
  contents: read

jobs:
  crawl:
    # Public repositories get standard GitHub-hosted runner usage free.
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install SiteOne Crawler
        shell: bash
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/janreges/siteone-crawler/setup.deb.sh' | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y siteone-crawler
          siteone-crawler --version

      - name: Prepare report directory
        run: mkdir -p reports crawler-data

      - name: Crawl website and generate reports
        shell: bash
        env:
          TARGET_URL: ${{ inputs.target_url }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          set -o pipefail
          siteone-crawler \
            --url="$TARGET_URL" \
            --max-visited-urls="$MAX_PAGES" \
            --max-queue-length="$MAX_PAGES" \
            --max-skipped-urls="$MAX_PAGES" \
            --workers=3 \
            --max-reqs-per-sec=5 \
            --memory-limit=10G \
            --result-storage=file \
            --result-storage-dir=crawler-data/results \
            --output-html-report=reports/drfabs-full-site-report.html \
            --output-json-file=reports/drfabs-full-site-data.json \
            --output-text-file=reports/drfabs-full-site-summary.txt

      - name: Upload crawl reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drfabs-siteone-crawl-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 7
